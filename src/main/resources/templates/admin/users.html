<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Dashboard</title>
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/admin/style.css" rel="stylesheet">
</head>
<body class="d-flex vh-100 overflow-hidden">

<script src="/js/admin/sidebar.js"></script>

<div class="main-content d-flex flex-column">
    <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">User Management</h1>
        <button id="addBtn" class="btn btn-primary d-flex align-items-center gap-2">
            <i class="bi bi-plus-lg"></i>
            <span>Create User</span>
        </button>
    </header>

    <main class="p-4 flex-fill overflow-y-auto">
        <div id="statusAlert" class="alert alert-danger d-none mb-4" role="alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-light d-flex justify-content-between align-items-center py-3">
                <div class="input-group style-search" style="max-width: 320px;">
                    <input type="text" id="searchInput" placeholder="Search..." class="form-control form-control-sm">
                    <button id="searchBtn" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="py-3 px-3">Username</th>
                        <th scope="col" class="py-3 px-3">Email</th>
                        <th scope="col" class="py-3 px-3">Role</th>
                        <th scope="col" class="py-3 px-3">Status</th>
                        <th scope="col" class="py-3 px-3 col-actions">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr><td colspan="6" class="text-center py-5 text-muted">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-light d-flex justify-content-between align-items-center py-2">
                <small id="pageInfo" class="text-muted">Showing page 1</small>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-bold" id="modalTitle">Create User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="createForm">
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">
                    <div id="formFields" class="d-flex flex-column gap-3"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.js"></script>
<script type="module" src="/js/admin/users.js"></script>
</body>
</html>
