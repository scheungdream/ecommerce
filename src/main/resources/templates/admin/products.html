<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Dashboard</title>
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/admin/style.css" rel="stylesheet">
</head>
<body class="d-flex vh-100 overflow-hidden">

<div class="toast-container"></div>
<script src="/js/admin/sidebar.js"></script>

<div class="main-content d-flex flex-column">
    <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">Product Management</h1>
        <div class="d-flex gap-2">
            <input type="file" id="fileUploadInput" class="d-none">
            <button id="addBtn" class="btn btn-primary d-flex align-items-center gap-2">
                <i class="bi bi-plus-lg"></i>
                <span>Add Product</span>
            </button>
        </div>
    </header>

    <main class="p-4 flex-fill overflow-y-auto">
        <div id="statusAlert" class="alert alert-danger d-none mb-4" role="alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-light d-flex justify-content-between align-items-center py-3">
                <div class="input-group style-search" style="max-width: 320px;">
                    <input type="text" id="searchInput" placeholder="Search..." class="form-control form-control-sm">
                    <button id="searchBtn" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="py-3 px-3">Preview</th>
                        <th scope="col" class="py-3 px-3">Name</th>
                        <th scope="col" class="py-3 px-3">Category</th>
                        <th scope="col" class="py-3 px-3">Price</th>
                        <th scope="col" class="py-3 px-3">Stock</th>
                        <th scope="col" class="py-3 px-3 col-actions">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr><td colspan="7" class="text-center py-5 text-muted">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-light d-flex justify-content-between align-items-center py-2">
                <small id="pageInfo" class="text-muted">Showing page 1</small>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-bold" id="modalTitle">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="createForm">
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">
                    <div id="formFields" class="d-flex flex-column gap-3">
                        <div>
                            <label for="name" class="form-label fw-semibold">Product Name</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                        <div>
                            <label for="category" class="form-label fw-semibold">Category</label>
                            <input type="text" id="category" name="category" class="form-control">
                        </div>
                        <div>
                            <label for="price" class="form-label fw-semibold">Price</label>
                            <input type="number" step="0.01" id="price" name="price" class="form-control" required>
                        </div>
                        <div>
                            <label for="stock" class="form-label fw-semibold">Initial Stock</label>
                            <input type="number" id="stock" name="stock" class="form-control" value="0" required>
                        </div>
                        <div>
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3"></textarea>
                        </div>
                        <div>
                                <label class="form-label fw-semibold">Product Image</label>

                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div class="position-relative" style="width: 80px; height: 80px;">
                                        <img id="imagePreview"
                                             src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%2280%22%20height%3D%2280%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23f8f9fa%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%236c757d%22%20font-size%3D%2210%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E"
                                             alt="Preview"
                                             class="w-100 h-100 rounded border object-fit-cover">
                                        <div id="uploadSpinner" class="position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-none d-flex align-items-center justify-content-center rounded">
                                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                        </div>
                                    </div>
                                    <div class="flex-grow-1">
                                        <input type="text" id="imageUrl" name="imageUrl" class="form-control form-control-sm mb-1" placeholder="Selected Image URL">
                                        <input type="file" id="imageFileInput" class="d-none" accept="image/*">
                                        <button type="button" class="btn btn-sm btn-outline-primary" id="selectImageBtn">
                                            <i class="bi bi-upload"></i> Upload New Image
                                        </button>
                                    </div>
                                </div>

                                <div class="border rounded p-2 bg-light">
                                    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                        <small class="fw-semibold text-secondary">Select from Uploaded Images</small>
                                        <button type="button" class="btn btn-sm btn-link text-decoration-none p-0" id="refreshGalleryBtn">
                                            <i class="bi bi-arrow-clockwise"></i> Refresh
                                        </button>
                                    </div>
                                    <div id="imageGallery" class="d-flex flex-wrap gap-2 overflow-y-auto" style="max-height: 160px;">
                                        <div class="text-center w-100 py-3 text-muted small">Loading gallery...</div>
                                    </div>
                                </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="stockModal" tabindex="-1" aria-labelledby="stockModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-bold" id="stockModalTitle">Adjust Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="stockForm">
                <div class="modal-body">
                    <input type="hidden" id="stockProductId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Stock</label>
                        <input type="text" id="currentStockDisplay" class="form-control" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Action</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="stockType" id="typeIncrease" value="INCREASE" checked>
                                <label class="form-check-label text-success fw-bold" for="typeIncrease">
                                    <i class="bi bi-plus-circle"></i> Add Stock (Increase)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="stockType" id="typeDecrease" value="DECREASE">
                                <label class="form-check-label text-danger fw-bold" for="typeDecrease">
                                    <i class="bi bi-dash-circle"></i> Reduce Stock (Decrease)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="stockQuantity" class="form-label fw-semibold">Quantity</label>
                        <input type="number" id="stockQuantity" name="quantity" class="form-control" min="1" value="1" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Adjustment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.js"></script>
<script type="module" src="/js/admin/products.js"></script>
<script src="/js/global.js"></script>
</body>
</html>
