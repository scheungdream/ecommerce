<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Dashboard</title>
  <link href="/css/bootstrap.css" rel="stylesheet">
  <link href="/css/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/admin/style.css" rel="stylesheet">
</head>
<body class="d-flex vh-100 overflow-hidden">

<script src="/js/admin/sidebar.js"></script>

<div class="main-content d-flex flex-column">
  <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
    <h1 id="pageTitle" class="h4 mb-0 fw-bold">Order Management</h1>
    <div class="d-flex gap-2">
      <input type="file" id="fileUploadInput" class="d-none" onchange="uploadSelectedFile(event)">
      <button id="addBtn" onclick="handleAdd()" class="btn btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-plus-lg"></i>
        <span id="addBtnText">New Order</span>
      </button>
    </div>
  </header>

  <main class="p-4 flex-fill overflow-y-auto">
    <div id="statusAlert" class="alert alert-danger d-none mb-4" role="alert"></div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-light d-flex justify-content-between align-items-center py-3">
        <div class="input-group style-search" style="max-width: 320px;">
          <input type="text" id="searchInput" onkeydown="handleSearchKeyDown(event)" placeholder="Search..." class="form-control form-control-sm">
          <button onclick="handleSearch()" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
            <i class="bi bi-search"></i> Search
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead id="tableHead" class="table-light"></thead>
          <tbody id="tableBody">
          <tr><td colspan="8" class="text-center py-5 text-muted">Loading data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card-footer bg-light d-flex justify-content-between align-items-center py-2">
        <small id="pageInfo" class="text-muted">Showing page 1</small>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </main>
</div>

<div id="modal-container"></div>

<script src="/js/bootstrap.bundle.js"></script>
</body>
</html>
