<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - Dashboard</title>
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/admin/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="d-flex vh-100 overflow-hidden">

<script src="/js/admin/sidebar.js"></script>

<div class="main-content d-flex flex-column">
    <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">Overview</h1>
    </header>

    <main class="p-4 flex-fill overflow-y-auto">
        <div id="statusAlert" class="alert alert-danger d-none mb-4" role="alert"></div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold text-uppercase" id="revenueCardTitle">Total Revenue (3M)</span>
                            <h3 id="totalRevenue" class="fw-bold mb-0 text-success">$0.00</h3>
                        </div>
                        <div class="bg-success-subtle text-success p-3 rounded-circle fs-4">
                            <i class="bi bi-currency-dollar"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold text-uppercase" id="ordersCardTitle">Total Orders (3M)</span>
                            <h3 id="totalOrders" class="fw-bold mb-0 text-primary">0</h3>
                        </div>
                        <div class="bg-primary-subtle text-primary p-3 rounded-circle fs-4">
                            <i class="bi bi-bag-check"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-light py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="card-title h6 mb-0 fw-bold">Revenue Overview</h5>
                <div class="btn-group btn-group-sm" role="group" id="rangeSelector">
                    <button type="button" class="btn btn-outline-primary active" data-range="3m">Recent 3 Months</button>
                    <button type="button" class="btn btn-outline-primary" data-range="6m">Recent 6 Months</button>
                    <button type="button" class="btn btn-outline-primary" data-range="1y">Recent 1 Year</button>
                    <button type="button" class="btn btn-outline-primary" data-range="ytd">YTD</button>
                </div>
            </div>
            <div class="card-body p-4" style="position: relative; height: 380px;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </main>
</div>

<script src="/js/bootstrap.bundle.js"></script>
<script type="module" src="/js/admin/overview.js"></script>
</body>
</html>
