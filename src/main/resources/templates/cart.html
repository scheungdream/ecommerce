<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Shopping Cart</title>
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
        }
        .cart-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .cart-header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .cart-item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
        }
        .cart-item .item-check {
            margin-right: 15px;
        }
        .cart-item .item-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .cart-item .item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
            background: #f8f9fa;
            flex-shrink: 0;
        }
        .cart-item .item-info {
            flex: 1;
            min-width: 150px;
        }
        .cart-item .item-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .cart-item .item-name a {
            color: #2c3e50;
            text-decoration: none;
        }
        .cart-item .item-name a:hover {
            color: #0d6efd;
        }
        .cart-item .item-category {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .cart-item .item-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e74c3c;
        }
        .cart-item .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 20px;
        }
        .cart-item .item-quantity button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #dee2e6;
            background: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-item .item-quantity button:hover {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
        .cart-item .item-quantity button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .cart-item .item-quantity button:disabled:hover {
            background: white;
            color: #6c757d;
            border-color: #dee2e6;
        }
        .cart-item .item-quantity span {
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 30px;
            text-align: center;
        }
        .cart-item .item-subtotal {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e74c3c;
            min-width: 100px;
            text-align: right;
        }
        .cart-item .item-actions {
            margin-left: 15px;
        }
        .cart-item .item-actions button {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 5px 10px;
            border-radius: 6px;
        }
        .cart-item .item-actions button:hover {
            background: #f8d7da;
        }
        .cart-item .item-stock-warning {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .cart-summary {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            bottom: 0;
            z-index: 100;
        }
        .cart-summary .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cart-summary .summary-total {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .cart-summary .summary-total .amount {
            color: #e74c3c;
            font-size: 1.8rem;
        }
        .cart-summary .btn-checkout {
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 25px;
        }
        .empty-cart {
            text-align: center;
            padding: 80px 0;
        }
        .empty-cart i {
            font-size: 5rem;
            color: #dee2e6;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 50px 0;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: stretch;
            }
            .cart-item .item-image {
                width: 80px;
                height: 80px;
                margin-right: 15px;
            }
            .cart-item .item-info {
                flex: 1;
            }
            .cart-item .item-quantity {
                margin: 10px 0;
            }
            .cart-item .item-subtotal {
                text-align: left;
            }
            .cart-summary .summary-row {
                flex-direction: column;
                align-items: stretch;
            }
            .cart-summary .btn-checkout {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="toast-container"></div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> E-Commerce
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/products">
                        <i class="bi bi-grid"></i> Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/cart">
                        <i class="bi bi-cart"></i> Cart
                        <span class="badge bg-danger cart-count" id="cartCount">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-box"></i> Orders
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" id="userInfo">
                        <span class="nav-link" id="userDisplay">
                            <i class="bi bi-person"></i> <span id="usernameDisplay">Guest</span>
                        </span>
                </li>
                <li class="nav-item" id="authButtons">
                    <a class="nav-link" href="/login">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </li>
                <li class="nav-item" id="logoutButton" style="display:none;">
                    <a class="nav-link" href="javascript:" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container cart-container mt-4">
    <div class="cart-header">
        <h2><i class="bi bi-cart"></i> Shopping Cart</h2>
        <p class="text-muted" id="cartSummaryText">View and manage items in your shopping cart</p>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading shopping cart...</p>
    </div>

    <div id="cartContainer"></div>

    <div class="empty-cart" id="emptyCart" style="display:none;">
        <i class="bi bi-cart-x"></i>
        <h4 class="mt-3">Your shopping cart is empty</h4>
        <p class="text-muted">Take a look around and add your favorite items to the cart</p>
        <a href="/products" class="btn btn-primary mt-3">
            <i class="bi bi-shop"></i> Go Shopping
        </a>
    </div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
        <div class="summary-row">
            <div>
            </div>
            <div class="text-end">
                <div class="summary-total">
                    Total: <span class="amount" id="totalAmount">$0.00</span>
                </div>
                <button class="btn btn-primary btn-checkout mt-2" onclick="checkout()">
                    <i class="bi bi-cart-check"></i> Checkout
                </button>
                <button class="btn btn-outline-danger btn-checkout mt-2 ms-2" onclick="clearCart()">
                    <i class="bi bi-trash"></i> Clear Cart
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let cartItems = [];
    let isUpdating = false;

    function formatPrice(price) {
        return '$' + parseFloat(price).toFixed(2);
    }

    async function checkAuth() {
        const token = getToken();
        await clearExpiredToken(token);
        if (token) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('logoutButton').style.display = 'block';
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('usernameDisplay').textContent = payload.sub || 'User';
            } catch (e) {
                document.getElementById('usernameDisplay').textContent = 'User';
            }
        } else {
            document.getElementById('authButtons').style.display = 'block';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('usernameDisplay').textContent = 'Guest';

            window.location.href = '/login';
        }
        await updateCartCount();
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    async function updateCartCount() {
        const token = getToken();
        if (!token) {
            document.getElementById('cartCount').textContent = '0';
            return;
        }
        await fetch('/api/cart/count', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('cartCount').textContent = data.count || 0;
            })
            .catch(() => {
                document.getElementById('cartCount').textContent = '0';
            });
    }

    async function loadCart() {
        const token = getToken();
        if (!token) {
            window.location.href = '/login';
            return;
        }

        showLoading(true);

        await fetch('/api/cart', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => {
                if (res.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    throw new Error('Session expired');
                }
                if (!res.ok) throw new Error('Failed to load');
                return res.json();
            })
            .then(async (data) => {
                cartItems = data || [];
                renderCart();
                showLoading(false);
                await updateCartCount();
            })
            .catch(err => {
                console.error('Failed to load shopping cart:', err);
                showLoading(false);
                showToast('Failed to load shopping cart. Please refresh and try again.', 'error');
            });
    }

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function renderCart() {
        const container = document.getElementById('cartContainer');
        const emptyCart = document.getElementById('emptyCart');
        const summary = document.getElementById('cartSummary');

        if (cartItems.length === 0) {
            container.innerHTML = '';
            emptyCart.style.display = 'block';
            summary.style.display = 'none';
            document.getElementById('cartSummaryText').textContent = 'Your cart is empty. Go add some items!';
            return;
        }

        emptyCart.style.display = 'none';
        summary.style.display = 'block';
        document.getElementById('cartSummaryText').textContent = `${cartItems.length} item(s) in total`;

        container.innerHTML = cartItems.map(item => {
            const product = item.product || {};
            const price = product.price || 0;
            const subtotal = price * item.quantity;
            const stock = product.stock || 0;
            const isStockInsufficient = stock < item.quantity;

            return `
                    <div class="cart-item fade-in" data-id="${item.id}" data-product-id="${product.id}">
                        <img src="${product.imageUrl}"
                             class="item-image"
                             alt="${product.name || 'Product'}">
                        <div class="item-info">
                            <div class="item-name">
                                <a href="/products/${product.id}">${product.name || 'Unknown Product'}</a>
                            </div>
                            <div class="item-category">
                                <i class="bi bi-tag"></i> ${product.category || 'Uncategorized'}
                            </div>
                            <div class="item-price mt-1">${formatPrice(price)}</div>
                            ${isStockInsufficient ? `
                                <div class="item-stock-warning">
                                    <i class="bi bi-exclamation-triangle"></i> Insufficient stock (${stock} remaining)
                                </div>
                            ` : ''}
                        </div>
                        <div class="item-quantity">
                            <button onclick="updateQuantity(${product.id}, ${item.quantity - 1})"
                                    ${item.quantity <= 1 ? 'disabled' : ''}>
                                <i class="bi bi-dash"></i>
                            </button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${product.id}, ${item.quantity + 1})"
                                    ${isStockInsufficient ? 'disabled' : ''}>
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                        <div class="item-subtotal">
                            ${formatPrice(subtotal)}
                        </div>
                        <div class="item-actions">
                            <button onclick="removeItem(${product.id})" title="Remove">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
        }).join('');

        updateSummary();
    }

    function updateSummary() {
        const totalAmount = cartItems.reduce((sum, item) => {
            const price = item.product?.price || 0;
            return sum + price * item.quantity;
        }, 0);

        document.getElementById('totalAmount').textContent = formatPrice(totalAmount);
    }

    async function updateQuantity(productId, newQuantity) {
        if (isUpdating) return;
        if (newQuantity < 1) return;

        isUpdating = true;
        const token = getToken();
        await fetch(`/api/cart/update?productId=${productId}&quantity=${newQuantity}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Update failed');
                return res.json();
            })
            .then(async () => {
                await loadCart();
                isUpdating = false;
            })
            .catch(() => {
                showToast('Failed to update quantity', 'error');
                isUpdating = false;
            });
    }

    async function removeItem(productId) {
        if (isUpdating) return;
        if (!confirm('Are you sure you want to remove this item?')) return;

        isUpdating = true;
        const token = getToken();
        await fetch(`/api/cart/remove/${productId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Remove failed');
                return res.text();
            })
            .then(async () => {
                showToast('Removed', 'info');
                await loadCart();
                isUpdating = false;
            })
            .catch(() => {
                showToast('Failed to remove item', 'error');
                isUpdating = false;
            });
    }

    async function clearCart() {
        if (cartItems.length === 0) return;

        const token = getToken();
        await fetch('/api/cart/clear', {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Clear failed');
                return res.text();
            })
            .then(async() => {
                showToast('Shopping cart cleared', 'info');
                await loadCart();
            })
            .catch(() => {
                showToast('Failed to clear shopping cart', 'error');
            });
    }

    function checkout() {
        const insufficientItems = cartItems.filter(item => {
            const stock = item.product?.stock || 0;
            return stock < item.quantity;
        });

        if (insufficientItems.length > 0) {
            const names = insufficientItems.map(item => item.product?.name || 'Unknown Product').join(', ');
            showToast(`The following items have insufficient stock: ${names}`, 'error');
            return;
        }

        sessionStorage.setItem('checkoutItems', JSON.stringify(cartItems));
        sessionStorage.setItem('checkoutTotal', JSON.stringify(
            cartItems.reduce((sum, item) => sum + (item.product?.price || 0) * item.quantity, 0)
        ));

        window.location.href = '/checkout';
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkAuth();
        loadCart();
    });

    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            loadCart();
        }
    });
</script>

<script src="/js/bootstrap.bundle.js"></script>
<script src="/js/global.js"></script>
</body>
</html>
