<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Products</title>
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .product-card .card-img-top {
            height: 200px;
            object-fit: cover;
            background: #f8f9fa;
        }
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }
        .product-stock {
            font-size: 0.9rem;
        }
        .product-stock .in-stock {
            color: #27ae60;
        }
        .product-stock .out-of-stock {
            color: #e74c3c;
        }
        .category-badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .search-box {
            border-radius: 25px;
            padding: 10px 20px;
        }
        .btn-add-cart {
            border-radius: 25px;
            padding: 8px 20px;
            transition: all 0.3s;
        }
        .btn-add-cart:hover {
            transform: scale(1.05);
        }
        .cart-badge {
            position: relative;
        }
        .cart-badge .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 0.7rem;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 50px 0;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .category-filter .btn {
            border-radius: 20px;
            margin: 3px;
        }
        .category-filter .btn.active {
            background-color: #0d6efd;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 80px 0;
        }
        .empty-state i {
            font-size: 5rem;
            color: #dee2e6;
        }
    </style>
</head>
<body>
<div class="toast-container"></div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> E-Commerce
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/products">
                        <i class="bi bi-grid"></i> Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart">
                        <i class="bi bi-cart"></i> Cart
                        <span class="badge bg-danger cart-count" id="cartCount">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-box"></i> Orders
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" id="userInfo">
                        <span class="nav-link" id="userDisplay">
                            <i class="bi bi-person"></i> <span id="usernameDisplay">Guest</span>
                        </span>
                </li>
                <li class="nav-item" id="authButtons">
                    <a class="nav-link" href="/login">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="registerButton" href="/register">
                        <i class="bi bi-person-plus"></i> Register
                    </a>
                </li>
                <li class="nav-item" id="logoutButton" style="display:none;">
                    <a class="nav-link" href="javascript:" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col">
            <h2><i class="bi bi-grid-3x3-gap-fill"></i> Products</h2>
            <p class="text-muted">Browse all products and find what you like</p>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <label for="searchInput"></label>
                <input type="text" class="form-control search-box" id="searchInput"
                    placeholder="Search product name..." onkeyup="searchProducts()">
                <button class="btn btn-outline-secondary" onclick="clearSearch()">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
        </div>
        <div class="col-md-4 text-end">
            <label for="sortSelect"></label>
            <select class="form-select" id="sortSelect" onchange="sortProducts()">
                <option value="default">Default Sort</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name">Name</option>
            </select>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col">
            <div class="category-filter">
                <button class="btn btn-outline-primary active" data-category="all" onclick="filterByCategory('all', this)">
                    <i class="bi bi-grid"></i> All
                </button>
                <button class="btn btn-outline-primary" data-category="Electronics" onclick="filterByCategory('Electronics', this)">
                    <i class="bi bi-laptop"></i> Electronics
                </button>
                <button class="btn btn-outline-primary" data-category="Audio" onclick="filterByCategory('Audio', this)">
                    <i class="bi bi-headphones"></i> Audio
                </button>
                <button class="btn btn-outline-primary" data-category="Wearables" onclick="filterByCategory('Wearables', this)">
                    <i class="bi bi-watch"></i> Wearables
                </button>
                <button class="btn btn-outline-primary" data-category="Appliances" onclick="filterByCategory('Appliances', this)">
                    <i class="bi bi-tv"></i> Appliances
                </button>
                <button class="btn btn-outline-primary" data-category="Clothing" onclick="filterByCategory('Clothing', this)">
                    <i class="bi bi-hdd-stack"></i> Clothing
                </button>
            </div>
        </div>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading products...</p>
    </div>

    <div class="row" id="productContainer">
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">
        <i class="bi bi-inbox"></i>
        <h4 class="mt-3">No Products</h4>
        <p class="text-muted">No products match your criteria</p>
    </div>

    <nav aria-label="Page navigation" class="mt-4" id="paginationContainer" style="display:none;">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
    </nav>
</div>

<script>
    let allProducts = [];
    let filteredProducts = [];
    let currentCategory = 'all';
    let currentPage = 1;
    const pageSize = 12;

    async function checkAuth() {
        const token = localStorage.getItem('token');
        await clearExpiredToken(token);
        if (token) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('registerButton').style.display = 'none';
            document.getElementById('logoutButton').style.display = 'block';
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('usernameDisplay').textContent = payload.sub || 'User';
            } catch (e) {
                document.getElementById('usernameDisplay').textContent = 'User';
            }
        } else {
            document.getElementById('authButtons').style.display = 'block';
            document.getElementById('registerButton').style.display = 'block';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('usernameDisplay').textContent = 'Guest';
        }
        await updateCartCount();
    }

    function logout() {
        localStorage.removeItem('token');
        checkAuth();
        showToast('Logged out', 'info');
        window.location.href = '/';
    }

    async function updateCartCount() {
        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('cartCount').textContent = '0';
            return;
        }

        await fetch('/api/cart', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => res.json())
            .then(cart => {
                document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            })
            .catch(() => {
                document.getElementById('cartCount').textContent = '0';
            });
    }

    async function loadProducts() {
        showLoading(true);
        await fetch('/api/products')
            .then(res => {
                if (!res.ok) throw new Error('Failed to load');
                return res.json();
            })
            .then(products => {
                products = products.content;
                allProducts = products;
                filteredProducts = [...products];
                renderProducts();
                showLoading(false);
            })
            .catch(err => {
                console.error('Failed to load products:', err);
                showLoading(false);
                showToast('Failed to load products, please refresh and try again', 'error');
                document.getElementById('productContainer').innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                            <p class="mt-3">Failed to load, please refresh the page</p>
                            <button class="btn btn-primary" onclick="loadProducts()">Retry</button>
                        </div>
                    `;
            });
    }

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function renderProducts() {
        const container = document.getElementById('productContainer');
        const emptyState = document.getElementById('emptyState');

        let displayProducts = [...allProducts];

        if (currentCategory !== 'all') {
            displayProducts = displayProducts.filter(p => p.category === currentCategory);
        }

        const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
        if (searchKeyword) {
            displayProducts = displayProducts.filter(p =>
                p.name.toLowerCase().includes(searchKeyword) ||
                p.description.toLowerCase().includes(searchKeyword)
            );
        }

        filteredProducts = displayProducts;

        const totalPages = Math.ceil(filteredProducts.length / pageSize);
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageProducts = filteredProducts.slice(start, end);

        if (pageProducts.length === 0) {
            container.innerHTML = '';
            emptyState.style.display = 'block';
            document.getElementById('paginationContainer').style.display = 'none';
            return;
        }
        emptyState.style.display = 'none';

        container.innerHTML = pageProducts.map(product => `
                <div class="col-md-3 col-sm-6 mb-4 fade-in">
                    <div class="card product-card">
                        <img src="${product.imageUrl}"
                             class="card-img-top"
                             alt="${product.name}">
                        <div class="card-body">
                            <span class="category-badge bg-light text-dark">${product.category || 'Uncategorized'}</span>
                            <h5 class="card-title mt-2">${product.name}</h5>
                            <p class="card-text text-muted small">${product.description ? product.description.substring(0, 60) + '...' : ''}</p>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="product-stock">
                                ${product.stock > 0
            ? `<span class="in-stock"><i class="bi bi-check-circle"></i> In Stock: ${product.stock}</span>`
            : `<span class="out-of-stock"><i class="bi bi-x-circle"></i> Out of Stock</span>`
        }
                            </div>
                            <button class="btn btn-primary btn-add-cart w-100 mt-2"
                                    onclick="addToCart(${product.id})"
                                    ${product.stock <= 0 ? 'disabled' : ''}>
                                <i class="bi bi-cart-plus"></i>
                                ${product.stock > 0 ? 'Add to Cart' : 'Sold Out'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const container = document.getElementById('paginationContainer');
        if (totalPages <= 1) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'block';

        const pagination = document.getElementById('pagination');
        let html = '';

        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:" onclick="changePage(${currentPage - 1})">Previous</a>
                    </li>`;

        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:" onclick="changePage(${i})">${i}</a>
                        </li>`;
        }

        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:" onclick="changePage(${currentPage + 1})">Next</a>
                    </li>`;

        pagination.innerHTML = html;
    }

    function changePage(page) {
        const totalPages = Math.ceil(filteredProducts.length / pageSize);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderProducts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function searchProducts() {
        currentPage = 1;
        renderProducts();
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        currentPage = 1;
        renderProducts();
    }

    function filterByCategory(category, button) {
        currentCategory = category;
        currentPage = 1;

        document.querySelectorAll('.category-filter .btn').forEach(btn => {
            btn.classList.remove('active');
        });
        button.classList.add('active');

        renderProducts();
    }

    function sortProducts() {
        const sortType = document.getElementById('sortSelect').value;

        switch(sortType) {
            case 'price-asc':
                filteredProducts.sort((a, b) => a.price - b.price);
                break;
            case 'price-desc':
                filteredProducts.sort((a, b) => b.price - a.price);
                break;
            case 'name':
                filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                break;
            default:
                filteredProducts = [...allProducts];
                if (currentCategory !== 'all') {
                    filteredProducts = filteredProducts.filter(p => p.category === currentCategory);
                }
                const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
                if (keyword) {
                    filteredProducts = filteredProducts.filter(p =>
                        p.name.toLowerCase().includes(keyword)
                    );
                }
        }

        currentPage = 1;
        renderProducts();
    }

    async function addToCart(productId) {
        const token = localStorage.getItem('token');
        if (!token) {
            showToast('Please login first', 'warning');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1000);
            return;
        }

        await fetch(`/api/cart/add?productId=${productId}&quantity=1`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
            .then(res => {
                if (res.ok) {
                    showToast('Added to cart!', 'success');
                    updateCartCount();
                } else if (res.status === 403) {
                    showToast('Session expired, please login again', 'error');
                    localStorage.removeItem('token');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    return res.text().then(text => { throw new Error(text || 'Failed to add'); });
                }
            })
            .catch(err => {
                showToast(err.message || 'Failed to add, please try again', 'error');
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkAuth();
        loadProducts();

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });
    });
</script>
<script src="/js/bootstrap.bundle.js"></script>
<script src="/js/global.js"></script>
</body>
</html>
